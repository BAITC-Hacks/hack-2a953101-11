services:
  backend:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      API_KEY: ${API_KEY:?Set API_KEY to a random secret of at least 24 characters}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    volumes:
      - warehouse-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
volumes:
  warehouse-data:
